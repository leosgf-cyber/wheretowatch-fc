<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Finder</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Face Finder</h1>
      <p>Encontre pessoas em vídeos a partir de fotos de referência</p>
    </header>

    <!-- CADASTRO DE PESSOAS -->
    <div class="section">
      <h2>1. Cadastrar Pessoas</h2>
      <div class="form-row">
        <div class="form-group" style="flex:1">
          <label>Nome / Papel</label>
          <input type="text" id="personName" placeholder="Ex: Pai da Noiva">
        </div>
        <label class="btn-upload" for="personPhotos">
          Selecionar fotos
        </label>
        <input type="file" id="personPhotos" multiple accept="image/*">
        <button class="btn btn-primary" id="addPersonBtn" onclick="addPerson()">Adicionar</button>
      </div>
      <div id="selectedFiles" style="font-size:12px; color:#888; margin-bottom:8px;"></div>
      <div id="peopleGrid" class="people-grid"></div>
      <div id="peopleEmpty" class="empty-state">Nenhuma pessoa cadastrada ainda.</div>
    </div>

    <!-- PROCESSAR VÍDEO -->
    <div class="section">
      <h2>2. Processar Vídeo</h2>
      <div class="video-upload-area" id="videoArea" onclick="document.getElementById('videoFile').click()">
        <p id="videoLabel">Clique para selecionar um vídeo</p>
        <input type="file" id="videoFile" accept="video/*" onchange="onVideoSelected(this)">
      </div>

      <div class="settings-row">
        <div class="form-group">
          <label>FPS</label>
          <input type="number" id="fpsInput" value="1" min="0.1" max="30" step="0.5">
        </div>
        <div class="form-group">
          <label>Início (opcional)</label>
          <input type="text" id="startInput" placeholder="01:33">
        </div>
        <div class="form-group">
          <label>Fim (opcional)</label>
          <input type="text" id="endInput" placeholder="22:21">
        </div>
        <div class="form-group">
          <label>Tolerância</label>
          <input type="number" id="toleranceInput" value="0.6" min="0.1" max="1.0" step="0.05">
        </div>
      </div>

      <button class="btn btn-primary" id="processBtn" onclick="startProcessing()">
        Processar Vídeo
      </button>

      <div class="progress-bar" id="progressBar">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <p class="progress-text" id="progressText">Iniciando...</p>
      </div>
    </div>

    <!-- RESULTADOS -->
    <div class="section results-section" id="resultsSection">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 style="margin-bottom:0;">Resultados</h2>
        <button class="btn btn-secondary" id="downloadBtn" onclick="downloadResults()">
          Baixar JSON
        </button>
      </div>
      <div id="resultsContainer"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
