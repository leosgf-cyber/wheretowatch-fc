; PlatformIO build definitions for the split-flap firmware.
;
;   pio run -e module   -> build the per-module firmware (ATmega328 / Arduino Nano)
;   pio run -e master   -> build the controller firmware (ESP32)
;   pio run -e module -t upload   (flash over USB)
;
; The shared core in src/core + include/ compiles into both. The native unit
; tests are built separately with CMake (see CMakeLists.txt), not here.
;
; src_dir is set to the project root so the filters can pick core + exactly one
; firmware entry point while ignoring test/ and the other firmware.

[platformio]
default_envs = master
src_dir = .

[env]
build_flags = -Iinclude -std=gnu++17

; ---- Per-module firmware (Arduino Nano / ATmega328P) -----------------------
[env:module]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_src_filter = -<*> +<src/core/> +<firmware/module/>

; ---- Master controller (ESP32) --------------------------------------------
[env:master]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = -<*> +<src/core/> +<firmware/master/>
